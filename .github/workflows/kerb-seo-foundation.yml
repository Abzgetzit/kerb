name: Build Kerb SEO foundation

on:
  push:
    paths:
      - ".github/workflows/kerb-seo-foundation.yml"

permissions:
  contents: write

jobs:
  seo-foundation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply technical SEO improvements
        shell: bash
        run: |
          set -euo pipefail

          # Turn the existing client-only homepage into a server page with metadata,
          # while preserving the exact rendered website and client behaviour.
          if [ -f app/page.js ] && grep -q '^"use client"' app/page.js; then
            mv app/page.js app/HomeClient.js
          fi

          cat > app/page.js <<'EOF'
          import HomeClient from "./HomeClient";

          const baseUrl = "https://kerbcar.co.uk";
          const title = "Kerb | Buy and Sell Used Cars in the UK";
          const description =
            "Kerb is a UK car marketplace for buying and selling used cars. Browse cars, list your car for free and contact sellers directly.";

          export const metadata = {
            title,
            description,
            keywords: [
              "Kerb",
              "Kerb Car",
              "used cars UK",
              "cars for sale UK",
              "sell my car",
              "car marketplace UK",
            ],
            alternates: {
              canonical: baseUrl,
            },
            robots: {
              index: true,
              follow: true,
              googleBot: {
                index: true,
                follow: true,
                "max-image-preview": "large",
                "max-snippet": -1,
                "max-video-preview": -1,
              },
            },
            openGraph: {
              title,
              description,
              url: baseUrl,
              siteName: "Kerb",
              locale: "en_GB",
              type: "website",
              images: [
                {
                  url: `${baseUrl}/cars/hero-car.png`,
                  alt: "Kerb UK car marketplace",
                },
              ],
            },
            twitter: {
              card: "summary_large_image",
              title,
              description,
              images: [`${baseUrl}/cars/hero-car.png`],
            },
          };

          const websiteSchema = {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "@id": `${baseUrl}/#website`,
            url: `${baseUrl}/`,
            name: "Kerb",
            alternateName: ["Kerb Car", "Kerb UK Car Marketplace"],
            description,
            inLanguage: "en-GB",
            publisher: {
              "@id": `${baseUrl}/#organization`,
            },
            potentialAction: {
              "@type": "SearchAction",
              target: {
                "@type": "EntryPoint",
                urlTemplate: `${baseUrl}/browse?keyword={search_term_string}`,
              },
              "query-input": "required name=search_term_string",
            },
          };

          const organizationSchema = {
            "@context": "https://schema.org",
            "@type": "OnlineBusiness",
            "@id": `${baseUrl}/#organization`,
            url: `${baseUrl}/`,
            name: "Kerb",
            alternateName: "Kerb Car",
            description,
            logo: {
              "@type": "ImageObject",
              url: `${baseUrl}/kerb-logo.svg`,
              contentUrl: `${baseUrl}/kerb-logo.svg`,
              width: 512,
              height: 512,
            },
            email: "hello@kerbcar.co.uk",
            areaServed: {
              "@type": "Country",
              name: "United Kingdom",
            },
          };

          function safeJsonLd(value) {
            return JSON.stringify(value).replace(/</g, "\\u003c");
          }

          export default function HomePage() {
            return (
              <>
                <script
                  type="application/ld+json"
                  dangerouslySetInnerHTML={{
                    __html: safeJsonLd([websiteSchema, organizationSchema]),
                  }}
                />
                <HomeClient />
              </>
            );
          }
          EOF

          # Preserve the listing UI, but provide each listing to the client during
          # server rendering so Google receives the actual car content immediately.
          if [ -f 'app/listing/[id]/page.js' ] && grep -q '^"use client"' 'app/listing/[id]/page.js'; then
            mv 'app/listing/[id]/page.js' 'app/listing/[id]/ListingClient.js'
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/listing/[id]/ListingClient.js")
          text = path.read_text()
          replacements = {
              "export default function ListingPage() {": "export default function ListingClient({ initialListing = null }) {",
              "const [car, setCar] = useState(null);": "const [car, setCar] = useState(initialListing);",
              "const [loading, setLoading] = useState(true);": "const [loading, setLoading] = useState(!initialListing);",
              "    if (id) loadListing();\n  }, [id]);": "    if (initialListing && String(initialListing.id) === String(id)) {\n      setCar(initialListing);\n      setLoading(false);\n      return;\n    }\n\n    if (id) loadListing();\n  }, [id, initialListing]);",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"Expected listing client text not found: {old}")
          path.write_text(text)
          PY

          cat > 'app/listing/[id]/page.js' <<'EOF'
          import { createClient } from "@supabase/supabase-js";
          import { notFound } from "next/navigation";
          import ListingClient from "./ListingClient";

          export const dynamic = "force-dynamic";

          const baseUrl = "https://kerbcar.co.uk";

          function createServerClient() {
            const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
            const supabaseKey =
              process.env.SUPABASE_SERVICE_ROLE_KEY ||
              process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;

            if (!supabaseUrl || !supabaseKey) return null;

            return createClient(supabaseUrl, supabaseKey, {
              auth: { persistSession: false, autoRefreshToken: false },
            });
          }

          async function getListing(id) {
            const supabase = createServerClient();
            if (!supabase || !id) return null;

            const { data, error } = await supabase
              .from("kerb_listings")
              .select("*")
              .eq("id", id)
              .eq("status", "approved")
              .maybeSingle();

            if (error || !data) return null;
            return data;
          }

          function cleanText(value) {
            return String(value || "").replace(/\s+/g, " ").trim();
          }

          function getTitle(listing) {
            return (
              cleanText(listing?.title) ||
              [
                listing?.year,
                listing?.make,
                listing?.model,
                listing?.model_detail,
                listing?.variant,
              ]
                .filter(Boolean)
                .join(" ")
                .trim() ||
              "Used car"
            );
          }

          function parseImages(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value.map(cleanText).filter(Boolean);

            if (typeof value === "string") {
              const trimmed = value.trim();
              if (!trimmed) return [];
              try {
                const parsed = JSON.parse(trimmed);
                if (Array.isArray(parsed)) return parsed.map(cleanText).filter(Boolean);
                if (typeof parsed === "string") return [cleanText(parsed)].filter(Boolean);
              } catch {
                return [cleanText(trimmed)].filter(Boolean);
              }
            }

            return [];
          }

          function getImages(listing) {
            const images = [
              ...parseImages(listing?.image_url),
              ...parseImages(listing?.photo_url),
              ...parseImages(listing?.main_photo_url),
              ...parseImages(listing?.cover_image_url),
              ...parseImages(listing?.photo_urls),
              ...parseImages(listing?.photos),
              ...parseImages(listing?.image_urls),
              ...parseImages(listing?.images),
            ];

            return [...new Set(images)]
              .filter(Boolean)
              .map((image) =>
                image.startsWith("http") ? image : `${baseUrl}${image.startsWith("/") ? "" : "/"}${image}`
              );
          }

          function getPrice(listing) {
            const price = Number(listing?.asking_price || listing?.price || 0);
            return Number.isFinite(price) && price > 0 ? price : 0;
          }

          function getCanonicalPath(listing) {
            return listing?.accept_bids
              ? `/bids/${listing.id}`
              : `/listing/${listing.id}`;
          }

          function getDescription(listing) {
            const title = getTitle(listing);
            const location = cleanText(listing?.location || listing?.city);
            const mileage = Number(listing?.mileage || 0);
            const details = [
              mileage > 0 ? `${new Intl.NumberFormat("en-GB").format(mileage)} miles` : "",
              cleanText(listing?.fuel_type || listing?.fuel),
              cleanText(listing?.gearbox || listing?.transmission),
              location ? `for sale in ${location}` : "for sale in the UK",
            ].filter(Boolean);
            const sellerText = cleanText(listing?.description);
            const description = `View this ${title}${details.length ? `, ${details.join(", ")}` : ""} on Kerb.${sellerText ? ` ${sellerText}` : ""}`;
            return description.slice(0, 160);
          }

          function safeJsonLd(value) {
            return JSON.stringify(value).replace(/</g, "\\u003c");
          }

          function buildVehicleSchema(listing) {
            const title = getTitle(listing);
            const canonicalUrl = `${baseUrl}${getCanonicalPath(listing)}`;
            const images = getImages(listing);
            const mileage = Number(listing?.mileage || 0);
            const price = getPrice(listing);

            const schema = {
              "@context": "https://schema.org",
              "@type": "Car",
              "@id": `${canonicalUrl}#vehicle`,
              url: canonicalUrl,
              mainEntityOfPage: canonicalUrl,
              name: title,
              description: getDescription(listing),
              image: images.length ? images : [`${baseUrl}/cars/hero-car.png`],
              brand: listing?.make
                ? { "@type": "Brand", name: cleanText(listing.make) }
                : undefined,
              model: cleanText(listing?.model || listing?.model_detail) || undefined,
              vehicleModelDate: listing?.year ? String(listing.year) : undefined,
              bodyType: cleanText(listing?.body_type) || undefined,
              fuelType: cleanText(listing?.fuel_type || listing?.fuel) || undefined,
              vehicleTransmission:
                cleanText(listing?.gearbox || listing?.transmission) || undefined,
              mileageFromOdometer:
                mileage > 0
                  ? {
                      "@type": "QuantitativeValue",
                      value: mileage,
                      unitCode: "SMI",
                    }
                  : undefined,
              itemCondition:
                cleanText(listing?.condition).toLowerCase() === "new"
                  ? "https://schema.org/NewCondition"
                  : "https://schema.org/UsedCondition",
              datePosted: listing?.created_at || undefined,
              offers:
                price > 0
                  ? {
                      "@type": "Offer",
                      url: canonicalUrl,
                      price,
                      priceCurrency: "GBP",
                      availability: "https://schema.org/InStock",
                    }
                  : undefined,
            };

            return Object.fromEntries(
              Object.entries(schema).filter(([, value]) => value !== undefined)
            );
          }

          export async function generateMetadata({ params }) {
            const resolvedParams = await params;
            const listing = await getListing(resolvedParams?.id);

            if (!listing) {
              return {
                title: "Car listing not found | Kerb",
                robots: { index: false, follow: false },
              };
            }

            const listingTitle = getTitle(listing);
            const location = cleanText(listing.location || listing.city);
            const canonicalUrl = `${baseUrl}${getCanonicalPath(listing)}`;
            const pageTitle = `${listingTitle} for Sale${location ? ` in ${location}` : ""} | Kerb`;
            const description = getDescription(listing);
            const images = getImages(listing);

            return {
              title: pageTitle,
              description,
              alternates: { canonical: canonicalUrl },
              robots: {
                index: true,
                follow: true,
                googleBot: {
                  index: true,
                  follow: true,
                  "max-image-preview": "large",
                  "max-snippet": -1,
                },
              },
              openGraph: {
                title: pageTitle,
                description,
                url: canonicalUrl,
                siteName: "Kerb",
                locale: "en_GB",
                type: "website",
                images: images.length ? images : [`${baseUrl}/cars/hero-car.png`],
              },
              twitter: {
                card: "summary_large_image",
                title: pageTitle,
                description,
                images: images.length ? [images[0]] : [`${baseUrl}/cars/hero-car.png`],
              },
            };
          }

          export default async function ListingPage({ params }) {
            const resolvedParams = await params;
            const listing = await getListing(resolvedParams?.id);

            if (!listing) notFound();

            return (
              <>
                <script
                  type="application/ld+json"
                  dangerouslySetInnerHTML={{ __html: safeJsonLd(buildVehicleSchema(listing)) }}
                />
                <ListingClient initialListing={listing} />
              </>
            );
          }
          EOF

          cat > app/layout.js <<'EOF'
          import "./globals.css";
          import "./post-chat-size-fixes.css";
          import "./chat-privacy-final.css";
          import "./short-description-fix.css";
          import "./bids-hero-final.css";
          import BrowseHeadingCleaner from "./components/BrowseHeadingCleaner";
          import KerbClientEnhancements from "./components/KerbClientEnhancements";
          import MobileListingContactButton from "./components/MobileListingContactButton";
          import HomeBidsAndBidHeroFix from "./components/HomeBidsAndBidHeroFix";
          import BidPageReplacement from "./components/BidPageReplacement";
          import PostCarBidTabs from "./components/PostCarBidTabs";
          import MobileAccountCompact from "./components/MobileAccountCompact";
          import MobilePostCarWizard from "./components/MobilePostCarWizard";
          import PostCarSafariUploadFix from "./components/PostCarSafariUploadFix";
          import BidListingSubmissionFix from "./components/BidListingSubmissionFix";
          import ListingBidsNavFix from "./components/ListingBidsNavFix";
          import BidSellerContactDetails from "./components/BidSellerContactDetails";

          const baseUrl = "https://kerbcar.co.uk";
          const defaultTitle = "Kerb | Buy and Sell Used Cars in the UK";
          const defaultDescription =
            "Kerb is a UK car marketplace for buying and selling used cars. Browse cars, list your car for free and contact sellers directly.";

          export const metadata = {
            metadataBase: new URL(baseUrl),
            applicationName: "Kerb",
            title: {
              default: defaultTitle,
              template: "%s",
            },
            description: defaultDescription,
            authors: [{ name: "Kerb", url: baseUrl }],
            creator: "Kerb",
            publisher: "Kerb",
            category: "automotive",
            referrer: "origin-when-cross-origin",
            formatDetection: {
              email: false,
              address: false,
              telephone: false,
            },
            manifest: "/manifest.webmanifest",
            icons: {
              icon: [{ url: "/icon.svg", type: "image/svg+xml" }],
              shortcut: ["/icon.svg"],
            },
            verification: process.env.GOOGLE_SITE_VERIFICATION
              ? { google: process.env.GOOGLE_SITE_VERIFICATION }
              : undefined,
            robots: {
              index: true,
              follow: true,
              googleBot: {
                index: true,
                follow: true,
                "max-image-preview": "large",
                "max-snippet": -1,
                "max-video-preview": -1,
              },
            },
            openGraph: {
              title: defaultTitle,
              description: defaultDescription,
              url: baseUrl,
              siteName: "Kerb",
              locale: "en_GB",
              type: "website",
              images: [
                {
                  url: "/cars/hero-car.png",
                  alt: "Kerb UK car marketplace",
                },
              ],
            },
            twitter: {
              card: "summary_large_image",
              title: defaultTitle,
              description: defaultDescription,
              images: ["/cars/hero-car.png"],
            },
          };

          export default function RootLayout({ children }) {
            return (
              <html lang="en-GB">
                <body>
                  <BrowseHeadingCleaner />
                  <KerbClientEnhancements />
                  <MobileListingContactButton />
                  <HomeBidsAndBidHeroFix />
                  <PostCarBidTabs />
                  <MobilePostCarWizard />
                  <PostCarSafariUploadFix />
                  <BidListingSubmissionFix />
                  <ListingBidsNavFix />
                  <BidSellerContactDetails />
                  <MobileAccountCompact />
                  <BidPageReplacement />
                  {children}
                </body>
              </html>
            );
          }
          EOF

          cat > app/sitemap.js <<'EOF'
          import { createClient } from "@supabase/supabase-js";

          export const dynamic = "force-dynamic";

          const baseUrl = "https://kerbcar.co.uk";

          const routes = [
            { path: "/", priority: 1, changeFrequency: "daily" },
            { path: "/browse", priority: 0.95, changeFrequency: "daily" },
            { path: "/bids", priority: 0.9, changeFrequency: "daily" },
            { path: "/sell-car", priority: 0.9, changeFrequency: "weekly" },
            { path: "/electric-cars", priority: 0.85, changeFrequency: "daily" },
            { path: "/new-cars", priority: 0.85, changeFrequency: "daily" },
            { path: "/cars-on-finance", priority: 0.8, changeFrequency: "daily" },
            { path: "/car-finance", priority: 0.75, changeFrequency: "monthly" },
            { path: "/first-cars", priority: 0.75, changeFrequency: "daily" },
            { path: "/family-suvs", priority: 0.75, changeFrequency: "daily" },
            { path: "/performance-cars", priority: 0.75, changeFrequency: "daily" },
            { path: "/guides", priority: 0.7, changeFrequency: "weekly" },
            { path: "/guides/how-to-sell-your-car", priority: 0.65, changeFrequency: "monthly" },
            { path: "/guides/buying-a-used-car-safely", priority: 0.65, changeFrequency: "monthly" },
            { path: "/safety", priority: 0.55, changeFrequency: "monthly" },
            { path: "/contact", priority: 0.55, changeFrequency: "monthly" },
            { path: "/terms", priority: 0.4, changeFrequency: "yearly" },
            { path: "/privacy", priority: 0.4, changeFrequency: "yearly" },
            { path: "/cookies", priority: 0.3, changeFrequency: "yearly" },
          ];

          async function getApprovedListings() {
            const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
            const supabaseKey =
              process.env.SUPABASE_SERVICE_ROLE_KEY ||
              process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;

            if (!supabaseUrl || !supabaseKey) return [];

            const supabase = createClient(supabaseUrl, supabaseKey, {
              auth: { persistSession: false, autoRefreshToken: false },
            });

            const { data, error } = await supabase
              .from("kerb_listings")
              .select("id,created_at,accept_bids")
              .eq("status", "approved")
              .order("created_at", { ascending: false })
              .limit(5000);

            if (error) {
              console.error("Kerb sitemap listing error:", error);
              return [];
            }

            return data || [];
          }

          export default async function sitemap() {
            const listings = await getApprovedListings();

            const staticEntries = routes.map((route) => ({
              url: `${baseUrl}${route.path}`,
              changeFrequency: route.changeFrequency,
              priority: route.priority,
            }));

            const listingEntries = listings.map((listing) => ({
              url: `${baseUrl}${listing.accept_bids ? "/bids" : "/listing"}/${listing.id}`,
              lastModified: listing.created_at ? new Date(listing.created_at) : undefined,
              changeFrequency: "weekly",
              priority: listing.accept_bids ? 0.8 : 0.85,
            }));

            return [...staticEntries, ...listingEntries];
          }
          EOF

          cat > app/robots.js <<'EOF'
          export default function robots() {
            return {
              rules: [
                {
                  userAgent: "*",
                  allow: "/",
                  disallow: [
                    "/admin",
                    "/api",
                    "/account",
                    "/login",
                    "/saved",
                    "/post-car",
                    "/boost",
                    "/enquiries",
                  ],
                },
              ],
              sitemap: "https://kerbcar.co.uk/sitemap.xml",
              host: "https://kerbcar.co.uk",
            };
          }
          EOF

          cat > app/manifest.js <<'EOF'
          export default function manifest() {
            return {
              name: "Kerb - UK Car Marketplace",
              short_name: "Kerb",
              description:
                "Buy and sell used cars across the UK with Kerb.",
              start_url: "/",
              display: "standalone",
              background_color: "#ffffff",
              theme_color: "#0048ff",
              lang: "en-GB",
              icons: [
                {
                  src: "/icon.svg",
                  sizes: "any",
                  type: "image/svg+xml",
                  purpose: "any maskable",
                },
              ],
            };
          }
          EOF

          cat > app/icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kerb">
            <rect width="512" height="512" rx="112" fill="#0048ff"/>
            <path fill="#fff" d="M126 104h78v119l105-119h95L286 234l127 174h-94l-86-119-29 31v88h-78V104Z"/>
          </svg>
          EOF

          mkdir -p public
          cp app/icon.svg public/kerb-logo.svg

          cat > middleware.js <<'EOF'
          import { NextResponse } from "next/server";
          import { KERB_SESSION_COOKIE } from "./app/lib/kerb-session-cookie";

          const canonicalHost = "kerbcar.co.uk";

          export function middleware(request) {
            const requestHost = String(request.headers.get("host") || "")
              .split(":")[0]
              .toLowerCase();
            const pathname = request.nextUrl.pathname;

            if (
              process.env.VERCEL_ENV === "production" &&
              (requestHost === `www.${canonicalHost}` || requestHost.endsWith(".vercel.app"))
            ) {
              const canonicalUrl = request.nextUrl.clone();
              canonicalUrl.protocol = "https:";
              canonicalUrl.hostname = canonicalHost;
              canonicalUrl.port = "";
              return NextResponse.redirect(canonicalUrl, 308);
            }

            if (!pathname.startsWith("/api/")) {
              return NextResponse.next();
            }

            const sessionCookie = request.cookies.get(KERB_SESSION_COOKIE)?.value;

            if (!sessionCookie) {
              return NextResponse.next();
            }

            const requestHeaders = new Headers(request.headers);
            requestHeaders.set("x-kerb-session-token", sessionCookie);

            return NextResponse.next({
              request: {
                headers: requestHeaders,
              },
            });
          }

          export const config = {
            matcher: [
              "/((?!_next/static|_next/image|favicon.ico|icon.svg|kerb-logo.svg|robots.txt|sitemap.xml|manifest.webmanifest).*)",
            ],
          };
          EOF

          git add -A
          git commit -m "Build Kerb technical SEO foundation"
          git push
